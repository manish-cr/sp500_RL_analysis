name: model-training
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'
      - uses: iterative/setup-cml@v1
      - name: Install PyTorch, torchvision, torchaudio
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install CML
        run: pip install cml
      - name: Train and report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt
          python src/script.py
          echo '# Model Comparison Report' > report.md
          echo '![](src/viz/comparison_rmse.png)' >> report.md
          echo '![](src/viz/comparison_r2.png)' >> report.md
          echo '![](src/viz/sample_predictions.png)' >> report.md
          cml comment create report.md
